[package]
name = "todo-service-data"
version = "0.1.0"
edition = "2024"

[dependencies]
todo-service-domain = { path = "../todo-service-domain" }

sqlx = { version = "0.8.6", features = [
    "postgres",
    "runtime-tokio",
    "uuid",
    "time",
] }
time = "0.3.41"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.18.0", features = ["v7"] }
async-trait = "0.1.89"

[profile.dev.package.sqlx-macros]
opt-level = 3
