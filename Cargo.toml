[package]
name = "todo-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
dotenvy = "0.15.7"
tonic = "0.14.0"
tonic-prost = "0.14.0"
prost = "0.14.1"
prost-types = "0.14.1"
serde = "1.0.219"
sqlx = { version = "0.8.6", features = [
    "postgres",
    "runtime-tokio",
    "uuid",
    "time",
] }
time = "0.3.41"
tokio = { version = "1.47.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
uuid = { version = "1.17.0", features = ["v7"] }

[build-dependencies]
tonic-prost-build = "0.14.0"

[profile.dev.package.sqlx-macros]
opt-level = 3
