[package]
name = "todo-service"
version = "0.6.0"
edition = "2024"

[dependencies]
todo-service-api = { path = "./crates/todo-service-api" }
todo-service-domain = { path = "./crates/todo-service-domain" }
todo-service-data = { path = "./crates/todo-service-data" }

tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
anyhow = "1.0.99"
dotenvy = "0.15.7"
tonic = "0.14.1"
tracing-subscriber = "0.3.19"
tracing = "0.1.41"

[dev-dependencies]
uuid = { version = "1.18.0", features = ["v7"] }

[profile.release]
opt-level = 3
overflow-checks = false
lto = "thin"
debug-assertions = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false

[profile.dev.build-override]
opt-level = 0
codegen-units = 256
debug = false       # when possible

[profile.release.build-override]
opt-level = 0
codegen-units = 256
